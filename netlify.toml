# Netlify публикует только папку site/. Сборки нет — это статическая страница.
# Данные страница берёт из ветки `data` этого репозитория на GitHub,
# поэтому ежечасные обновления не вызывают деплоев и не расходуют кредиты Netlify.
[build]
  publish = "site"
  command = ""
  # Каждый production-деплой стоит 15 кредитов Netlify. Пересобираем сайт только при изменениях в site/:
  # правки сборщика, тестов и документации деплой не запускают (git diff --quiet = 0 → сборка пропускается).
  # Если нужно задеплоить вручную: в Netlify Deploys → Trigger deploy.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"

# Service worker (офлайн-режим) браузер должен перепроверять при каждом визите, иначе обновления страницы застрянут
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Шрифт не меняется: пусть браузер держит его год и не перепроверяет
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
