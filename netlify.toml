# Netlify публикует только папку site/. Сборки нет — это статическая страница.
# Данные страница берёт из ветки `data` этого репозитория на GitHub,
# поэтому ежечасные обновления не вызывают деплоев и не расходуют кредиты Netlify.
[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
