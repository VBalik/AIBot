name: Update digest

# Каждый час: читает ленты, пишет абстракты, переводит, публикует данные в ветку `data`
# и (если задан TELEGRAM_BOT_TOKEN) отправляет готовые статьи в Telegram. Раз в неделю пересматривает источники
# по оценкам и чтению Валерия (закрытый репозиторий AIBot-feedback, секрет FEEDBACK_TOKEN).
# Ветка `data` перезаписывается одним коммитом (без истории), чтобы репозиторий не разрастался.
# Netlify собирает только main, поэтому обновления данных не тратят кредиты Netlify.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      max_translations:
        description: "Сколько полных переводов за запуск"
        required: false
        default: ""
      review:
        description: "Пересмотреть источники сейчас, не дожидаясь недели"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Получить текущие данные
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git worktree add --detach data FETCH_HEAD
          else
            mkdir -p data
          fi

      - name: Собрать дайджест
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIGEST_PASSWORD: ${{ secrets.DIGEST_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
          REVIEW: ${{ inputs.review && 'force' || '' }}
          PROVIDER: ${{ vars.PROVIDER }}
          COMPARE_PROVIDER: ${{ vars.COMPARE_PROVIDER }}
          COMPARE_LIMIT: ${{ vars.COMPARE_LIMIT }}
          COMPARE_MODEL: ${{ vars.COMPARE_MODEL }}
          OPENAI_MODEL_SCORE: ${{ vars.OPENAI_MODEL_SCORE }}
          OPENAI_MODEL_ABSTRACT: ${{ vars.OPENAI_MODEL_ABSTRACT }}
          OPENAI_MODEL_TRANSLATE: ${{ vars.OPENAI_MODEL_TRANSLATE }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT }}
          GEMINI_MODEL_SCORE: ${{ vars.GEMINI_MODEL_SCORE }}
          GEMINI_MODEL_ABSTRACT: ${{ vars.GEMINI_MODEL_ABSTRACT }}
          GEMINI_MODEL_TRANSLATE: ${{ vars.GEMINI_MODEL_TRANSLATE }}
          GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL }}
          CLAUDE_MODEL_SCORE: ${{ vars.CLAUDE_MODEL_SCORE }}
          CLAUDE_MODEL_ABSTRACT: ${{ vars.CLAUDE_MODEL_ABSTRACT }}
          CLAUDE_MODEL_TRANSLATE: ${{ vars.CLAUDE_MODEL_TRANSLATE }}
          SHOW_MIN_SCORE: ${{ vars.SHOW_MIN_SCORE }}
          TRANSLATE_MIN_SCORE: ${{ vars.TRANSLATE_MIN_SCORE }}
          MAX_TRANSLATIONS_PER_RUN: ${{ inputs.max_translations || vars.MAX_TRANSLATIONS_PER_RUN }}
          MAX_TRANSLATE_CHARS: ${{ vars.MAX_TRANSLATE_CHARS }}
          INTERESTS: ${{ vars.INTERESTS }}
          TELEGRAM_MAX_POSTS_PER_RUN: ${{ vars.TELEGRAM_MAX_POSTS_PER_RUN }}
          SITE_URL: ${{ vars.SITE_URL }}
          FEEDBACK_REPO: ${{ vars.FEEDBACK_REPO }}
          REVIEW_EVERY_DAYS: ${{ vars.REVIEW_EVERY_DAYS }}
          REVIEW_MIN_SCORE: ${{ vars.REVIEW_MIN_SCORE }}
          REVIEW_KEEP_SCORE: ${{ vars.REVIEW_KEEP_SCORE }}
          REVIEW_GRACE_DAYS: ${{ vars.REVIEW_GRACE_DAYS }}
          REVIEW_MAX_CANDIDATES: ${{ vars.REVIEW_MAX_CANDIDATES }}
        run: python digest/build.py --data data

      - name: Опубликовать данные в ветку data
        if: always()
        run: |
          cd data
          [ -f feed.json ] || { echo "Данных нет — публиковать нечего"; exit 0; }
          [ -e .git ] || git init -q
          git config user.name "ai-digest-bot"
          git config user.email "ai-digest-bot@users.noreply.github.com"
          git add -A
          if git rev-parse -q --verify HEAD >/dev/null && git diff --cached --quiet; then
            echo "Изменений нет"; exit 0
          fi
          git checkout -q --orphan snapshot
          git commit -qm "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/data
